name: dataset

on:
  workflow_dispatch:
    inputs:
      synth_jobs:
        description: Brave-grounded synthetic teacher calls to run
        required: false
        default: "20"
      synth_examples_per_job:
        description: Synthetic examples requested per teacher call (max 8)
        required: false
        default: "4"
      start_training:
        description: Submit a fine-tune request to llm.starintel.actor after validation
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.repos.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Inventory all configured public repositories
        id: repos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > repos.ndjson
          while IFS= read -r owner; do
            gh api --paginate "/users/${owner}/repos?type=public&per_page=100" \
              --jq '.[] | select(.fork == false and .archived == false) | {name: .full_name, clone_url: .clone_url}' \
              >> repos.ndjson
          done < <(jq -r '.owners[]' config/repositories.json)

          jq -c '.extra_repositories[]? | {
            name: .name,
            clone_url: (.clone_url // ("https://github.com/" + .name + ".git"))
          }' config/repositories.json >> repos.ndjson

          repos="$(jq -sc 'unique_by(.name)' repos.ndjson)"
          printf 'matrix=%s\n' "$(jq -cn --argjson repos "$repos" '{include:$repos}')" >> "$GITHUB_OUTPUT"

  harvest:
    needs: inventory
    if: ${{ fromJson(needs.inventory.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone public source and taskify
        env:
          REPO: ${{ matrix.name }}
          CLONE_URL: ${{ matrix.clone_url }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 "$CLONE_URL" source
          python scripts/star_dataset.py build \
            --repo source \
            --repository "$REPO" \
            --output "out/${REPO//\//__}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ strategy.job-index }}
          path: out/*.jsonl
          if-no-files-found: error
          retention-days: 7

  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Brave-grounded synthetic corpus
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          STAR_LLM_ACTOR_URL: ${{ secrets.STAR_LLM_ACTOR_URL }}
          STAR_LLM_ACTOR_TOKEN: ${{ secrets.STAR_LLM_ACTOR_TOKEN }}
          STAR_SYNTH_MODEL: ${{ vars.STAR_SYNTH_MODEL }}
          STAR_BRAVE_TRAINING_RIGHTS_ACK: ${{ vars.STAR_BRAVE_TRAINING_RIGHTS_ACK }}
          SYNTH_JOBS: ${{ inputs.synth_jobs || '20' }}
          SYNTH_EXAMPLES_PER_JOB: ${{ inputs.synth_examples_per_job || '4' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BRAVE_SEARCH_API_KEY:-}" || { echo 'BRAVE_SEARCH_API_KEY is required'; exit 1; }
          test -n "${STAR_LLM_ACTOR_URL:-}" || { echo 'STAR_LLM_ACTOR_URL is required'; exit 1; }
          test -n "${STAR_LLM_ACTOR_TOKEN:-}" || { echo 'STAR_LLM_ACTOR_TOKEN is required'; exit 1; }
          test -n "${STAR_SYNTH_MODEL:-}" || { echo 'STAR_SYNTH_MODEL repository variable is required'; exit 1; }
          test "${STAR_BRAVE_TRAINING_RIGHTS_ACK:-}" = "1" || {
            echo 'Set STAR_BRAVE_TRAINING_RIGHTS_ACK=1 only when the configured Brave plan permits this storage/training use.'
            exit 1
          }
          mkdir -p out
          python scripts/synthesize_brave.py generate \
            --output out/synthetic.jsonl \
            --max-jobs "$SYNTH_JOBS" \
            --examples-per-seed "$SYNTH_EXAMPLES_PER_JOB"
          test -s out/synthetic.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-synthetic
          path: out/synthetic.jsonl
          if-no-files-found: error
          retention-days: 7

  mix:
    needs: [harvest, synthesize]
    runs-on: ubuntu-latest
    env:
      DATASET_ARTIFACT: star-model-dataset-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-*
          path: incoming
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize, deduplicate, split, and package trainer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dataset/trainer
          cat incoming/*.jsonl > dataset/all.raw.jsonl
          python scripts/validate_mix.py \
            --input dataset/all.raw.jsonl \
            --output-dir dataset
          cp trainer/train_qlora.py trainer/requirements.txt dataset/trainer/
          python scripts/star_dataset.py manifest \
            --name "star-model-${GITHUB_SHA}" \
            --artifact-repository "$GITHUB_REPOSITORY" \
            --artifact-run-id "$GITHUB_RUN_ID" \
            --artifact-name "$DATASET_ARTIFACT" \
            --output dataset/manifest.json \
            dataset/train.jsonl dataset/validation.jsonl dataset/test.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATASET_ARTIFACT }}
          path: dataset/
          if-no-files-found: error
          retention-days: 30

  train:
    needs: mix
    if: ${{ inputs.start_training == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: star-model-dataset-${{ github.sha }}
          path: dataset
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fine-tune request
        env:
          BASE_MODEL: ${{ vars.STAR_BASE_MODEL }}
          MAX_HOURLY_GPU_USD: ${{ vars.STAR_MAX_HOURLY_GPU_USD || '2.0' }}
          MAX_TOTAL_GPU_USD: ${{ vars.STAR_MAX_TOTAL_GPU_USD || '20.0' }}
          GPU_RAM_GB_MIN: ${{ vars.STAR_GPU_RAM_GB_MIN || '24' }}
        run: |
          set -euo pipefail
          test -n "${BASE_MODEL:-}" || { echo 'STAR_BASE_MODEL repository variable is required'; exit 1; }
          python scripts/star_dataset.py actor-request \
            --manifest dataset/manifest.json \
            --base-model "$BASE_MODEL" \
            --gpu-ram-gb-min "$GPU_RAM_GB_MIN" \
            --max-hourly-gpu-usd "$MAX_HOURLY_GPU_USD" \
            --max-total-gpu-usd "$MAX_TOTAL_GPU_USD" \
            --output fine-tune.json
      - name: Submit training to llm.starintel.actor
        env:
          STAR_LLM_ACTOR_URL: ${{ secrets.STAR_LLM_ACTOR_URL }}
          STAR_LLM_ACTOR_TOKEN: ${{ secrets.STAR_LLM_ACTOR_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${STAR_LLM_ACTOR_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @fine-tune.json \
            "${STAR_LLM_ACTOR_URL%/}/v1/fine-tunes" | tee fine-tune-response.json
      - uses: actions/upload-artifact@v4
        with:
          name: fine-tune-request-${{ github.sha }}
          path: |
            fine-tune.json
            fine-tune-response.json
