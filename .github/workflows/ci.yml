name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Seed evolution population
        run: |
          python scripts/evolve_finetune.py seed --output-dir /tmp/evolution/g000
          test "$(find /tmp/evolution/g000 -name 'candidate-*.json' | wc -l)" -eq 6
      - name: Check configured task weights
        run: |
          python - <<'PY'
          import pathlib, tomllib
          cfg = tomllib.loads(pathlib.Path('config/dataset.toml').read_text())
          total = sum(float(item['weight']) for item in cfg['tasks'])
          assert abs(total - 1.0) < 1e-9, total
          evo = tomllib.loads(pathlib.Path('config/evolution.toml').read_text())
          mix = sum(float(v) for v in evo['dataset_mix'].values())
          assert abs(mix - 1.0) < 1e-9, mix
          PY
